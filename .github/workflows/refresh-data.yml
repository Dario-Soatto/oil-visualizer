name: Refresh price data

# AAA updates daily. Running at 11:00 UTC lands after the overnight update and
# before most US traffic. Prices move a few cents a week, so a daily cadence is
# ample -- there is nothing to gain from hourly.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: npm ci

      # Both stages exit non-zero on trouble -- fetch below 45 states, build on
      # any failed artifact check -- so the job stops before committing.
      - name: Run the pipeline
        run: npm run data

      # Committed before the database load, not after: AAA serves only today's
      # prices, so a scrape is unrepeatable. If Postgres is unreachable the day's
      # map should still land in the repo, and the job should still go red.
      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counties.json public/relief.json
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "Refresh prices $(date -u +%Y-%m-%d)"
            git push
          fi

      # Not conditional. This step used to be skipped when DATABASE_URL was
      # unset, which meant a repository without the secret ran green every day
      # while writing nothing to the history -- the exact failure the history is
      # there to prevent, made invisible. `ingest` reads the day back after
      # writing it, so this step is red unless the scrape is actually in there.
      - name: Load the snapshot into the price history
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set, so this scrape was not"
            echo "::error::added to the price history. Set it under Settings >"
            echo "::error::Secrets and variables > Actions. Today's prices are"
            echo "::error::committed, but AAA does not serve past dates: any day"
            echo "::error::this step does not run is a permanent gap in the history."
            exit 1
          fi
          node scripts/db.mjs ingest
