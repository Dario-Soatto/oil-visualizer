name: Refresh price data

# AAA updates daily. Running at 11:00 UTC lands after the overnight update and
# before most US traffic. Prices move a few cents a week, so a daily cadence is
# ample -- there is nothing to gain from hourly.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # job-level so the ingest step's `if` can test whether it is set at all
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: npm ci

      # Both stages exit non-zero on trouble -- fetch below 45 states, build on
      # any failed artifact check -- so the job stops before committing.
      - name: Run the pipeline
        run: npm run data

      # Skipped until DATABASE_URL is set as a repo secret, so the refresh still
      # works before the database is wired up.
      - name: Load the snapshot into Postgres
        if: ${{ env.DATABASE_URL != '' }}
        run: node scripts/db.mjs ingest

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counties.json data/history.json public/relief.json
          if git diff --cached --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "Refresh prices $(date -u +%Y-%m-%d)"
            git push
          fi
